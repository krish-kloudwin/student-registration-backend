name: Backend CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_registration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/student_registration
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET_KEY: ci-test-jwt-secret-key-for-testing-only-12345
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python compilation and syntax
        run: |
          python -m compileall app/

      - name: Verify application import and database initialization
        run: |
          python -c "import app.main; print('Application loaded successfully')"

      - name: Run pytest test suite
        run: |
          pytest --ignore=venv || { exit_code=$?; if [ $exit_code -eq 5 ]; then echo "No tests collected (exit code 5), passing check."; else exit $exit_code; fi; }

      - name: Build backend Docker image
        run: |
          docker build -t student-registration-backend:ci .

  trigger-integration:
    name: Trigger Full-Stack Integration CI
    needs: backend-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Trigger integration workflow
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${INFRA_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/krish-kloudwin/student-registration-infra/dispatches \
            -d "{\"event_type\":\"backend-updated\",\"client_payload\":{\"backend_sha\":\"${GITHUB_SHA}\"}}"
